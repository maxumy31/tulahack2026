services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql
  rag_db:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdatabase
    ports:
      - "5433:5432"
    volumes:
      - rag_db_data:/var/lib/postgresql/data
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/mydatabase
      NODE_ENV: development
      WATCHPACK_POLLING: true
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://raguser:ragpassword@rag_db:5432/ragdatabase
      DB_VECTOR_EXTENSION: pgvector
    depends_on:
      - rag_db
volumes:
  db_data:
  rag_db_data: